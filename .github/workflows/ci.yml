name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Check syntax and imports
        run: python -c "from app.services.calculate import Calculator; print('Build OK')"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests
        run: pytest app/tests/ -v

  deploy:
    name: Deploy Artifact
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --name calculator app/services/calculate.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-executable
          path: dist/calculator
          retention-days: 7

  notify:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Send success email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Pipeline passou com sucesso - ${{ github.repository }}"
          to: marcelo.hopv@gmail.com
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Olá!

            A pipeline do repositório ${{ github.repository }} passou com sucesso!

            Detalhes:
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Autor: ${{ github.actor }}
            - Workflow: ${{ github.workflow }}
            - Run: ${{ github.run_number }}

            O artefato (executável) está disponível em:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Atenciosamente,
            GitHub Actions
